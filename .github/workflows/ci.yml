# Repository consistency CI: catches the drift this repo is prone to —
# broken relative links, index.yaml out of sync, version mismatches, and
# Jekyll build breakage — on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Repo consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/validate_repo.py

  build:
    name: Jekyll build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same builder GitHub Pages uses; validates the site builds, no deploy.
      - uses: actions/jekyll-build-pages@v1
      - name: Validate rendered metadata and links
        shell: bash
        run: python3 scripts/validate_site.py _site 2>&1 | tee site-validation.log
      - name: Save rendered site and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-site
          path: |
            _site
            site-validation.log
          retention-days: 3

  links-internal:
    name: Internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Offline mode verifies in-repo relative links only. Markdown files
      # only: layouts/index.html contain Liquid variables lychee cannot
      # resolve and would report as false positives.
      - uses: ./.github/actions/check-links
        with:
          args: --offline --no-progress --include-fragments "**/*.md"

  links-external:
    name: External links (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # External URLs are checked but never block: forums and vendor pages
      # rate-limit and flake. Review the step summary when it goes red.
      - uses: ./.github/actions/check-links
        with:
          # NHTSA blocks automated CI requests with 403; verify this URL manually.
          # Only this exact recall lookup URL is excluded. Other URLs remain checked.
          args: --no-progress --max-concurrency 8 --max-retries 5 --retry-wait-time 2 --scheme https --scheme http --exclude '^https://www[.]nhtsa[.]gov/recalls/?$' "**/*.md"


  brief:
    name: Vehicle brief contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python scripts/build_brief_data.py --check
      - run: npm test

  browser:
    name: Vehicle brief browser
    needs: build
    # Match the OS supported by the pinned Playwright release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: rendered-site
          path: browser-build
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/brief-browser.mjs browser-build/_site
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-brief-screenshots
          path: browser-artifacts
          retention-days: 7
