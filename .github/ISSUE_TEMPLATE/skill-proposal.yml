name: "💡 New Skill Proposal / 新しいスキルの提案"
description: "Propose a new automotive AI skill. 新しいスキルの提案(日本語でOKです)"
title: "[skill]: "
labels: ["enhancement", "new-skill"]
body:
  - type: markdown
    attributes:
      value: |
        Before proposing, please check the [roadmap](https://github.com/shoka-jp/automotive-ai-skills/blob/main/README.md#roadmap) and
        the [Skill Authoring Guide](https://github.com/shoka-jp/automotive-ai-skills/blob/main/docs/skill-authoring-guide.md).
        Proposals are discussed here first, before anyone invests writing effort. 日本語での提案も歓迎します。
  - type: input
    id: name
    attributes:
      label: Skill name / スキル名
      placeholder: "Diesel Specialist"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and audience / 対象範囲・利用者
      description: "What does it cover, for whom, and how is it distinct? / 何を誰に提供し、既存スキルとどう違いますか？"
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Example prompts / 想定する質問例
      description: "Optional: 2–3 example questions. / 任意：質問例があれば2〜3件。"
    validations:
      required: false
  - type: dropdown
    id: author
    attributes:
      label: Would you like to help write it? / 執筆への参加
      options:
        - "Yes, following the authoring guide / ガイドに沿って執筆する"
        - "I can provide domain knowledge / 知識面で協力できる"
        - "Proposal only / 提案のみ"
    validations:
      required: false
