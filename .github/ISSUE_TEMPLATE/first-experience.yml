name: "Feedback / 感想 / Comentarios"
description: "Questions or ideas / 質問・感想 / Preguntas o ideas"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying the project! A short question, suggestion or confusing step helps; no code or car is needed.
        **This issue will be public.** Remove VINs, license plates, credentials, names, contact details and other private information, including from screenshots and logs.
        試して分かりにくかった点や質問を歓迎します。**Issueは公開されます。** 車台番号、ナンバープレート、認証情報、氏名・連絡先などは画像やログからも取り除いてください。
        ¡Gracias por probar el proyecto! Puedes escribir una pregunta o sugerencia sin saber programar ni tener un coche.
        **Este issue será público.** No incluyas VIN, matrículas, credenciales, nombres, datos de contacto ni otra información privada, tampoco en capturas o registros.
  - type: dropdown
    id: area
    attributes:
      label: "Area / 場所 / Área"
      options:
        - "Demo / デモ / Demostración"
        - "Documentation / 説明 / Documentación"
        - "Other / その他 / Otro"
    validations:
      required: false
  - type: textarea
    id: feedback
    attributes:
      label: "What was unclear? / 分かりにくかった点 / ¿Qué fue confuso?"
      description: "A short description is fine. / 一言からで大丈夫です。 / Una frase basta."
      placeholder: "For example: I could not find the next step in the demo. / 例：デモの次の手順が分からなかった。 / Ejemplo: no encontré el siguiente paso de la demostración."
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: "What would help? / どうなると使いやすいですか？ / ¿Qué ayudaría?"
      description: "Optional; questions without a solution are welcome. / 任意です。解決案がなくても歓迎します。 / Opcional; también aceptamos preguntas sin solución."
    validations:
      required: false
