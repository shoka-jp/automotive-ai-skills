      locale: ja_JP
  - scope:
      path: README.es.md
    values:
      title: Habilidades de IA para diagnóstico y mantenimiento de vehículos
      description: 16 guías de trabajo con IA para diagnóstico, mantenimiento y compra de vehículos. Cuatro
