      description: 現代および旧世代のディーゼルエンジンのためのAIスキルです。コモンレールシステム、排ガス後処理装置(DPF/EGR/SCR)、グロープラグ、ターボチャージャー、ディーゼル特有の診断と整備をカバーします。
