      lang: en
      locale: en_US
  - scope:
      path: docs/faq.md
    values:
      title: 'Automotive AI Skills FAQ: setup, languages and limitations'
      description: Answers about installing skills, reading OBD-II data, supported languages, free use,
        accuracy limits and contributing corrections.
      lang: en
      locale: en_US
  - scope:
      path: skills/README.md
    values:
      title: Choose an automotive AI skill
      description: Find the right prompt framework for a warning light, maintenance plan, used-car inspection,
        EV, motorcycle or repair task. Browse all 16 skills.
      lang: en
      locale: en_US
  - scope:
      path: docs/README.md
    values:
      title: Automotive AI guides and demos
      description: Start using the skills, run the hardware-free OBD-II MCP demo, read FAQs and find Japanese
        guides and contribution documentation.
      lang: en
      locale: en_US

# LICENSE is intentionally not excluded: README badges link to ./LICENSE,
# so it must be published (served as plain text) to avoid a 404.
# SKILL.md files are plugin inputs read from git, not site content — they
# rendered as orphan pages with generic titles, so they are excluded.
exclude:
  - CHANGELOG.md
  - .gitignore
  - scripts
  - "skills/*/SKILL.md"

# jekyll-optional-front-matter skips README/CONTRIBUTING/CODE_OF_CONDUCT by
# default, so they were served as raw text/markdown instead of HTML pages.
# Whitelisting them here (matched by basename at any depth) makes them render
# and lets jekyll-relative-links rewrite links to them as .html.
include:
  - README.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
