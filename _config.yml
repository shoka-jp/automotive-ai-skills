      locale: ja_JP
  - scope:
      path: skills/diesel-specialist/README.md
    values:
      description: An AI skill for modern and older diesel engines — common rail systems, emissions aftertreatment
        (DPF/EGR/SCR), glow plugs, turbochargers, and diesel-specific diagnosis and maintenance.
      lang: en
      locale: en_US
  - scope:
      path: skills/ev-assistant/README.ja.md
    values:
      description: 電気自動車のオーナーシップ全般を支援するAIスキルです。充電戦略、バッテリー健全性、航続距離の管理、EV特有の整備、自宅充電の設備計画、新車・中古EVの購入ガイダンスをカバーします。
