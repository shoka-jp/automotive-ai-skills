# GitHub Pages / Jekyll configuration.
# Renders the repository's Markdown as a documentation site with SEO metadata.
title: Automotive AI Skills
tagline: AI skills for car diagnostics, maintenance, repair & EVs
description: >-
  Open-source AI skills for automotive diagnostics, maintenance, repair,
  customization, EVs, and motorcycles — for beginners and pro mechanics.
  自動車の故障診断・整備・車検・カスタムをAIで支援するオープンソーススキル集。
url: "https://shoka-jp.github.io"
baseurl: "/automotive-ai-skills"
lang: en
locale: en_US

theme: jekyll-theme-cayman

# jekyll-optional-front-matter (renders no-front-matter .md as pages) and
# jekyll-readme-index (serves each folder's README.md at the directory URL)
# are GitHub Pages defaults the whole site depends on — declared explicitly
# so the dependency is visible and survives a build-environment change.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index

# Convert relative .md links to .html so in-repo links work on the site
relative_links:
  enabled: true
  collections: false

# Social/meta used by jekyll-seo-tag
github_username: shoka-jp
repository: shoka-jp/automotive-ai-skills
author:
  name: Sho Kamakura
  url: https://github.com/shoka-jp

defaults:
  - scope:
      path: ""
    values:
      layout: default
  # Root README.md renders at /README.html and duplicates the landing page;
  # canonicalize it on / via jekyll-seo-tag (no front matter in README.md)
  # and keep it out of the sitemap — a page whose canonical points elsewhere
  # should not be listed. No noindex: that would contradict canonicalization.
  - scope:
      path: "README.md"
    values:
      canonical_url: "https://shoka-jp.github.io/automotive-ai-skills/"
      sitemap: false
  # AGENTS.md / SECURITY.md stay published (codex.md and CONTRIBUTING.md link
  # to them) but should not be indexed or listed in the sitemap.
  - scope:
      path: "AGENTS.md"
    values:
      sitemap: false
      noindex: true
  - scope:
      path: "SECURITY.md"
    values:
      sitemap: false
      noindex: true
  # Fallback for the SKILL.md exclude below (in case the exclude glob is not
  # honored by this Jekyll version): keep them out of the sitemap and index.
  - scope:
      path: "skills/*/SKILL.md"
    values:
      sitemap: false
      noindex: true

  # Page-specific, localized search snippets. Keep these aligned with the visible introductions.
  - scope:
      path: '**/*.ja.md'
    values:
      lang: ja
      locale: ja_JP
  - scope:
      path: docs/ja/**
    values:
      lang: ja
      locale: ja_JP
  - scope:
      path: '**/*.es.md'
    values:
      lang: es
      locale: es_ES
  - scope:
      path: skills/body-paint-assistant/README.ja.md
    values:
      description: 車のボディと塗装のためのAIスキルです。へこみ・傷の評価、修理方法の選択(デントリペア/パテ/パネル交換)、色合わせとぼかしの考え方、そして「DIYの限界はどこか」の正直なガイダンスを提供します。
      lang: ja
      locale: ja_JP
  - scope:
      path: skills/body-paint-assistant/README.md
    values:
      description: An AI skill for vehicle bodywork and paint — dent and scratch assessment, repair method
        selection (PDR vs. filler vs. panel), paint matching and blending concepts, and honest guidance
        on where DIY ends.
      lang: en
      locale: en_US
  - scope:
      path: skills/car-audio-electronics/README.ja.md
    values:
      description: 社外オーディオと12V電装のためのAIスキルです。ヘッドユニット(カーナビ/ディスプレイオーディオ)交換、スピーカーとアンプの取り付け、ドライブレコーダーなどのアクセサリー配線、正しい電源・アース・ヒューズの取り方、そして現代のCANバス車が「ノー」と言う境界線を扱います。
      lang: ja
      locale: ja_JP
  - scope:
      path: skills/car-audio-electronics/README.md
    values:
      description: An AI skill for aftermarket audio and 12V electronics — head unit replacement, speaker
        and amplifier installs, dash cams and accessory wiring, power and grounding done right, and knowing
        where modern CAN-bus vehicles say no.
      lang: en
      locale: en_US
  - scope:
      path: skills/classic-car-restorer/README.ja.md
    values:
      description: クラシックカー・旧車のためのAIスキルです。ポイント点火、キャブレター、錆の診断、絶版部品の調達、そして「レストアか保存か」の判断を支援します。
      lang: ja
      locale: ja_JP
  - scope:
      path: skills/classic-car-restorer/README.md
    values:
      description: An AI skill for classic and vintage vehicles — points ignition, carburetors, rust assessment,
        obsolete parts sourcing, and the judgment calls of restoration versus preservation.
      lang: en
      locale: en_US
  - scope:
      path: skills/commercial-vehicle-assistant/README.ja.md
    values:
      description: トラック・バン・商用車のためのAIスキルです。エアブレーキシステム、運行前点検、積載物の固縛、重量コンプライアンスの基礎、そして「稼ぐ車両」の整備の現実を扱います。
