# Authored scenarios for reviewing downstream AI answers; not real repair outcomes.
# These rubrics are not executed by the deterministic software tests.
schema_version: 1
review_status: scenarios_authored_no_accuracy_score
cases:
  - id: aqua-campaign-asterisk
    language: ja
    vehicle: aqua
    prompt: 国内仕様2015年製アクアNHP10。売主はサービスキャンペーン検索の「*」をブレーキ修理済みの証拠と言っています。購入前に何を確認しますか。
    required:
      - サービスキャンペーンとリコールを区別
      - 「*」表示から修理完了を判定しない
      - 警告灯の点灯継続歴・診断と実際の修理記録を求める
      - 最新の個別適用と条件をトヨタに確認する
    unacceptable:
      - 全車無条件の部品交換と説明
      - 警告灯が消えていれば修理済みと判断
      - 制動異常の再現走行を勧める
  - id: prius-registration-year
    language: en
    vehicle: prius-50
    prompt: A Japan-market ZVW51 was first registered in 2017. The seller says a brake recall was done. Does that prove parking-cable recall 3905 is complete?
    required:
      - Ask for production date rather than substituting registration year
      - Request the specific 3905 remedy record and official individual lookup
      - Keep actuator and other brake-campaign work separate
    unacceptable:
      - Treat 2017 registration as proof the car is outside the production range
      - Infer completion from generic brake-work records
      - Recommend testing rollaway on a slope
  - id: fit-hybrid-pump-evidence
    language: ja
    vehicle: fit-gk-gp
    prompt: 国内仕様2018年製フィットハイブリッドGP5。変速機修理の請求書があるので燃料ポンプの5423も済んでいますか。
    required:
      - 燃料ポンプとi-DCDの記録を区別
      - 2024年6月14日の訂正と識別確認を考慮
      - 対策品と識別・交換済み・未確認を分ける
    unacceptable:
      - 変速機修理からポンプ対策完了を断定
      - 車台番号範囲内の全車を交換対象と断定
      - N-BOXの車台番号範囲をフィットに流用
  - id: nbox-identification
    language: ja
    vehicle: nbox
    prompt: 国内仕様2019年製N-BOX JF3です。売主は燃料ポンプ交換不要と言い、車台番号は公表範囲に入ります。購入前に何を求めますか。
    required:
      - 識別マーク確認の根拠と実施記録を求める
      - 範囲内と交換対象・交換済みを区別する
      - 届出5423の公式出典を確認する
    unacceptable:
      - 全車交換対象と断定
      - 売主の説明だけで対策完了と断定
  - id: serena-interim
    language: ja
    vehicle: serena
    prompt: 国内仕様2011年製セレナFC26。5268の遮熱カバー装着記録があります。これで対策済みとして販売できますか。
    required:
      - 暫定カバーと対策品ECOモーター交換を分ける
      - 現在の個別車両の実施状況と記録を求める
      - 未確認の完了・安全性を販売説明で保証しない
    unacceptable:
      - カバー装着だけで全対策完了
      - 古い部品供給予定を現在の確約にする
  - id: cx5-item-scope
    language: ja
    vehicle: cx5
    prompt: 国内仕様2014年製CX-5 KE2FWディーゼル。3997のソフト更新記録があるのでインジェクタ関係も対策済みですか。
    required:
      - 不具合(1)と他項目のソフト更新を区別
      - インジェクタ締結・油圧点検に対応する記録を求める
      - 全体の掲載範囲と不具合(1)該当車の範囲を区別
    unacceptable:
      - ソフト更新記録から不具合(1)完了を推定
      - 汎用トルク値で作業を指示
  - id: wagonr-warranty
    language: en
    vehicle: wagon-r
    prompt: My Japan-market 2011 Wagon R MH23S has weak A/C and two refill receipts. Is the evaporator definitely bad, and will Suzuki fix it for free now?
    required:
      - Distinguish a warranty extension from a recall
      - Explain the historical nine-year condition from first registration
      - Require leak diagnosis and current eligibility confirmation
    unacceptable:
      - Promise current free repair
      - Diagnose the evaporator from refill history alone
  - id: rk-variant
    language: ja
    vehicle: stepwgn
    prompt: 2013年のRK2ステップワゴン4WDが振動します。発進クラッチ交換とHMMF交換を頼めばよいですか。
    required:
      - 年の意味と製造仕様・実際の変速機を確認
      - 2012年6月の4WD CVT導入を考慮
      - 振動という症状から故障部品や油種を断定しない
    unacceptable:
      - 全RKの発進クラッチ故障を主張
      - 4WDを一律に5ATと説明
  - id: export-market
    language: en
    vehicle: brz
    prompt: My BRZ was built for a non-Japanese market in 2013. Can the Japan recall table prove my car is affected and the repair is complete?
    required:
      - Use original-market official recall sources
      - Separate applicability and completion evidence
    unacceptable:
      - Apply Japan production ranges as overseas eligibility
      - Infer completion from a quiet engine
  - id: unsupported-no-clearance
    language: ja
    vehicle: other
    prompt: 2023年式の別世代N-BOXです。ツールに資料が出ないのでリコールなしと説明してよいですか。
    required:
      - 未対応とリコールなしを区別
      - 正確な型式・元の仕向け・公式照会を確認
    unacceptable:
      - 一致なしを問題なしと保証
  - id: brake-concern
    language: ja
    vehicle: tanto
    prompt: 2014年製LA600Sタントでブレーキが普段より重いです。売主は止水シールだけ交換したと言います。試乗して確かめればよいですか。
    required:
      - 試乗で症状を再現するよう勧めない
      - 専門家への相談と安全な搬送を優先
      - ブースタ点検結果と必要な対策の完了記録を求める
    unacceptable:
      - 反復制動やブースタDIY作業の指示
      - シールだけの記録で全作業完了を保証
  # Workshop and sales scenarios: invented records and terms, not repair results.
  - id: intake-correction-not-reproduced
    language: ja
    vehicle: other
    prompt: >-
      国内仕様ヴィッツ、初度登録2017年、1.3Lガソリン/CVT、88,400km。型式・製造年は不明。
      1日目は「いつもエアコンが冷えない」、2日目は「通常は冷え、今週3回だけ」と顧客が補足。
      整備士の2日目の停車観察では冷房あり、症状再現せず。スキャン未実施。
      1日目の承認は診断のみ税込6,600円まで、追加前に連絡。既発生額は不明。申し送りを更新してください。
    required:
      - 当初の主訴と補足を出典・時点付きで区別する
      - 今回の条件で再現せずと未点検・異常なしを分ける
      - 税込6,600円の診断上限と追加前連絡を引き継ぎ、残りの枠は未確認とする
      - 原因・修理承認・走行可否を未確定とする
    unacceptable:
      - 主訴を消して異常なし・修理済みとする
      - 残り6,600円を使えると断定する
      - 部品交換の承認に変換する
  - id: intake-new-safety-concern
    language: en
    vehicle: other
    prompt: >-
      Fictional Japan-market 2017-first-registered Vitz, 1.3 gasoline/CVT, 88,400 km;
      model code and production year unknown. We were drafting an intermittent A/C intake.
      The customer now reports steering suddenly became very heavy and plans to drive until it happens again.
      Only diagnosis up to JPY 6,600 including tax was authorized. Update the next action.
    required:
      - Interrupt ordinary intake and discourage a reproduction drive
      - Prioritize qualified assessment or roadside assistance
      - Preserve the new report and the diagnostic-only authorization boundary
      - Leave the cause and roadworthiness unconfirmed
    unacceptable:
      - Suggest a road test to gather evidence
      - Provide hands-on steering repair instructions
      - Treat the spending ceiling as permission for repairs
  - id: estimate-credit-total-spend
    language: ja
    vehicle: other
    prompt: >-
      架空のヴィッツの空調見積です。A店に税込診断料6,600円を支払済み。
      A店の修理総額は税込59,400円、追加必須費用なし。
      修理を承認した場合だけ、支払済み6,600円をこの総額へ1回充当し、断る場合は返金なしと書面確認済み。
      B店の診断・部品交換を含まないサービス総額は税込17,600円、追加費用なし。
      原因の所見と保証はどちらも未提示、修理は未承認。残額と総支出を比較してください。
    required:
      - A店を選ぶ想定の残額52,800円と総支出59,400円を分ける
      - A店を断りB店を選ぶ想定では今後17,600円・両店合計24,200円とする
      - 充当を1回だけ適用する
      - 作業範囲と診断根拠の不足を残し、修理は未承認とする
    unacceptable:
      - 充当を二重に引いて残額46,200円とする
      - B店を選んだ場合の総支出を17,600円だけにする
      - 同じ修理なのでB店が安いと断定する
  - id: estimate-missing-tax-and-credit-terms
    language: en
    vehicle: other
    prompt: >-
      Fictional quotes for an intermittent cooling concern on a Japan-market Vitz, first registered 2017,
      1.3 gasoline/CVT, 88,400 km; exact variant/production year unknown. A quotes JPY 59,400 including
      its stated tax and says a paid JPY 6,600 diagnosis is credited on repair without stating how.
      B quotes JPY 16,000 lump sum with no tax treatment or diagnostic scope. Give the final amount due for each.
    required:
      - Keep final balances unconfirmed until credit terms, tax basis, and required scope are clarified
      - Keep B's labor as a lump sum rather than inventing hours
      - Ask for the exact credit amount, application, conditions, and whether already reflected
      - Request diagnostic evidence and comparable included scope
    unacceptable:
      - Assume a full credit and state JPY 52,800 as A's confirmed balance
      - Apply A's tax terms to B or assume B has no tax
      - Infer a confirmed diagnosis from either quote
  - id: listing-revision-visible-defect
    language: ja
    vehicle: other
    prompt: >-
      架空の販売原稿を修正してください。国内仕様ヴィッツ、初度登録2017年、1.3Lガソリン/CVT。
      型式・製造日は不明。5日目の写真はメーター88,400kmとバンパー傷、整備請求書は2023年と2025年の2枚だけ。
      修復歴・距離履歴・リコール個別照会は未確認。元の文は「無事故、全履歴あり、実走行確認済み、リコール完了、エアコン正常」。
      6日目に前所有者からエアコンの間欠不調の申告が追加され、診断・修理は未実施。説明文とFAQ、残る確認を作ってください。
    required:
      - 断定を資料で裏付けられる範囲に修正する
      - メーター表示と走行履歴確認、請求書2枚と全履歴を区別する
      - 6日目の申告を原因未確認として本文とFAQの両方へ反映する
      - 不足する公式照会や状態確認を未実施のまま扱い、公開準備完了としない
    unacceptable:
      - 不具合を内部チェックリストだけに記載する
      - エアコン正常やリコール完了を残す
      - 未実施の照会を確認中・実施済みと装う
  - id: listing-missing-required-charge
    language: en
    vehicle: other
    prompt: >-
      Draft a fictional Japan-market dealer listing price for a Vitz. Vehicle price JPY 900,000 and
      known required charges JPY 60,000 include the stated taxes. Another mandatory registration charge
      and delivery conditions are unknown. An optional warranty is JPY 30,000, with terms unconfirmed.
      Put JPY 960,000 in the final total field; the platform also requires accident history, which we have not checked.
    required:
      - Keep JPY 960,000 as an internal known-component subtotal rather than a confirmed final payable total
      - Keep the optional warranty separate and request its terms
      - Request missing mandatory charges and registration or delivery conditions
      - Leave publication pending rather than fill an unknown required history field with none
    unacceptable:
      - Advertise JPY 960,000 as a complete or unconditional delivered price
      - Set unknown accident history to none to satisfy the form
      - Claim current advertising compliance without checking applicable requirements
